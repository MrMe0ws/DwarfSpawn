# Конфигурация плагина DwarfSpawn
# Плагин для настройки спавна гномов под землей

# Включить/выключить радиус спавна
radius-enabled: true
# Радиус спавна (в блоках)
# Игроки будут спавниться в случайной точке в пределах этого радиуса от центра
spawn-radius: 100

# Конкретная точка спавна (если radius-enabled: false)
# Формат: x, y, z, world
# ВАЖНО: Укажите правильное название мира!
# Чтобы узнать название мира на вашем сервере, посмотрите в лог при загрузке плагина
# или используйте команду /worlds (если установлен соответствующий плагин)
spawn-location:
  x: 0
  y: 51
  z: 0
  world: world # Измените на название вашего мира, если оно отличается

# Минимальная высота для спавна
# Игроки не будут спавниться ниже этого уровня
min-spawn-height: 25

# Максимальная высота для спавна
# Игроки не будут спавниться выше этого уровня
max-spawn-height: 46

# Проверять наличие блока над головой
# Если true, игроки будут спавниться только там, где над ними есть блок
check-block-above: true

# Максимальное количество попыток найти подходящее место для спавна
# Больше попыток = больше шанс найти место, но выше нагрузка на сервер
# Рекомендуемое значение: 50-200 (по умолчанию 100)
max-spawn-attempts: 100

# ============================================
# Настройки стартового набора (Start Kit)
# ============================================

# Включить/выключить выдачу стартового набора
start-kit-enabled: true

# Промежуток времени между выдачами стартового набора (в секундах)
# Если игрок умирает второй раз в течение этого времени, набор не выдается
# Пример: 300 = 5 минут
start-kit-cooldown: 30

# Предметы стартового набора
# Формат: "материал:количество" или "материал:количество|параметры"
# Параметры (разделяются символом |):
#   - name:Название - кастомное название предмета (поддерживает цветовые коды &)
#   - damage:ЧИСЛО - повреждение предмета (сколько единиц прочности повреждено, должно быть меньше максимальной прочности)
#   - enchant:ЗАЧАРОВАНИЕ:УРОВЕНЬ - зачарование (можно указать несколько через повторение параметра)
# Доступные проклятия: vanishing_curse (проклятие утраты), binding_curse (проклятие привязки)
# Примеры:
#   - "OAK_LOG:4" - 4 бревна дуба
#   - "STONE_PICKAXE:1" - 1 каменная кирка
#   - "LEATHER_HELMET:1|name:Шляпа от солнца|damage:54|enchant:vanishing_curse:1" - кожаный шлем с названием, повреждением и проклятием утраты
#   - "WOODEN_PICKAXE:1|enchant:vanishing_curse:1" - деревянная кирка с проклятием утраты
start-kit-items:
  - "LEATHER_HELMET:1|name:&6Шляпа от солнца|damage:46|enchant:vanishing_curse:1"
  - "CARROT:16"
  - "WOODEN_PICKAXE:1|enchant:vanishing_curse:1"
  #  - "GLOW_BERRIES:16"
  - "TORCH:1"
  - "OAK_LOG:4"
  - "OAK_SAPLING:3"

# Включить/выключить выдачу эффектов при возрождении
# Эффекты выдаются всегда при возрождении (независимо от кулдауна), если включено
start-kit-effects-enabled: true

# Эффекты для игрока при выдаче стартового набора
# Формат: "тип_эффекта:уровень:длительность_в_секундах"
# Примеры:
#   - "NIGHT_VISION:1:30" - ночное зрение 1 уровня на 30 секунд
#   - "SPEED:1:60" - скорость 1 уровня на 60 секунд
# Чтобы отключить эффекты, оставьте список пустым или установите start-kit-effects-enabled: false
start-kit-effects:
  - "NIGHT_VISION:1:30"

# ============================================
# Настройки книги при первом входе
# ============================================

# Включить/выключить выдачу книги при первом входе
first-join-book-enabled: true

# Текст книги (можно использовать цвета и форматирование)
# Используйте символ & для цветов Minecraft (например, &a для зеленого)
# Используйте \n для новой строки
# Для кликабельных ссылок используйте формат [текст](url)
# Пример: "Перейдите на [наш сайт](https://example.com)"
# ВАЖНО: Комментарии внутри списка first-join-book-pages не поддерживаются!
# Если нужны комментарии, разместите их выше списка
first-join-book-title: "&6☼ Гайд Карликов ☼"
first-join-book-author: "Глав. Карлик"
first-join-book-pages:
  - "&lДобро пожаловать в Подземку_228\n\n&rЭто мини-гайд по серверу. На поверхности вы слабы, чем ниже - тем лучше"
  - "&lРост и зелья\n\n&rВсе игроки рождаются с разным ростом. Можно скрафтить зелье роста и попытать удачу"
  - "&lОбвалы и опоры\n\n&rЧтобы блоки не обваливались, нужно скрафтить опору - булыжник\\колот. глубин. сланец + любое обтёс. дерево + булыжник\\колот. глубин. сланец"
  - "&lПриватные блоки\n\n&rАлмаз руда, Изумруд руда и их глубинные аналоги. И древние обломки. Блоки можно добыть шелк касанием"
  - "&lПочинка предметов\n\n&rПочинка отключена. Она делает игру казуальной и дисбалансной"
  - "&lДварф режим\n\n&rНа солнце горишь и слаб. Глубже под землю — сила растёт ▲. Спавн всегда под блоком, чтобы выжить"
  - "&lПодземелья и строения\n\n&rДобавлены новые подземелья и постройки"
  - "&lСоветы выживания\n\n&rПланируй маршруты, избегай дневного света, следи за мобами"
  - "&lСсылки\n\n&rДискорд - [Нажмите здесь](https://discord.gg/XmbNEr3rkX)\n\nТГ - [Нажмите здесь](https://t.me/podzemka228)"

# ============================================
# Настройки команды /rtp (случайная телепортация)
# ============================================

# Включить/выключить команду /rtp
rtp-enabled: true

# Мир для телепортации
# Игроки будут телепортироваться в этот мир
rtp-world: world

# Радиус телепортации (в блоках)
# Игроки будут телепортироваться в случайную точку в пределах этого радиуса от спавна
# Радиус считается от точки spawn-location из конфига
rtp-radius: 100

# Случайный спавн по Y координате (на поверхности)
# Если true - телепортация на поверхность мира (как в ваниле), игнорируются min-height и max-height
# Если false - поиск сверху вниз (от max-height к min-height), как в спавне, под землей
rtp-random-y: false

# Минимальная высота для телепортации
# Игроки не будут телепортироваться ниже этого уровня
rtp-min-height: 25

# Максимальная высота для телепортации
# Игроки не будут телепортироваться выше этого уровня
rtp-max-height: 46

# Проверять наличие блока над головой
# Если true, игроки будут телепортироваться только туда, где над ними есть блок
rtp-check-block-above: true

# Максимальное количество попыток найти подходящее место для телепортации
# Больше попыток = больше шанс найти место, но выше нагрузка на сервер
# Рекомендуемое значение: 50-200 (по умолчанию 100)
rtp-max-attempts: 100

# Задержка перед телепортацией (в секундах)
# Игрок будет видеть обратный отсчет перед телепортацией
rtp-delay: 3

# Кулдаун между использованиями команды (в секундах)
# Если игрок использует команду повторно в течение этого времени, команда не сработает
# Пример: 60 = 1 минута
rtp-cooldown: 60

# Включить/выключить режим отладки
# Если true, в консоль будут выводиться подробные сообщения о процессе телепортации
rtp-debug: false

# Визуальные эффекты при телепортации
# Включить/выключить визуальные эффекты
rtp-visual-effects-enabled: true

# Эффекты зелий, которые будут применены к игроку после телепортации
# Формат: "тип_эффекта:уровень:длительность_в_секундах"
# Примеры:
#   - "BLINDNESS:1:1" - слепота 1 уровня на 1 секунду (для эффекта мигания)
#   - "RESISTANCE:1:3" - сопротивление 1 уровня на 3 секунды
#   - "FIRE_RESISTANCE:1:5" - огнестойкость 1 уровня на 5 секунд
# Чтобы отключить эффекты зелий, оставьте список пустым
rtp-potion-effects:
  - "BLINDNESS:1:1"

# Частицы, которые будут показаны при телепортации
# Доступные типы: PORTAL, END_ROD, TOTEM, ENCHANTMENT_TABLE, CRIT, SMOKE_LARGE, EXPLOSION_LARGE, CLOUD, FIREWORKS_SPARK и другие
# Чтобы отключить частицы, установите значение в "NONE" или оставьте пустым
rtp-particle-effect: "PORTAL"

# Количество частиц (чем больше, тем эффектнее, но выше нагрузка)
rtp-particle-count: 50

# Настраиваемые сообщения для команды /rtp
# Поддерживаются цветовые коды Minecraft (&a, &6, &c и т.д.)
# Можно использовать переменные: {delay} - задержка, {countdown} - обратный отсчет, {seconds} - оставшиеся секунды кулдауна, {world} - название мира
rtp-messages:
  only-players: "&c[DwarfSpawn] &7Эта команда доступна только игрокам!"
  no-permission: "&c[DwarfSpawn] &7У вас нет прав на использование этой команды!"
  disabled: "&c[DwarfSpawn] &7Команда /rtp отключена в конфигурации!"
  cooldown: "&c[DwarfSpawn] &7Вы должны подождать еще &e{seconds} &7секунд перед следующим использованием!"
  teleport-start: "&6[DwarfSpawn] &7Телепортация через &e{delay} &7секунд... Не двигайтесь!"
  countdown: "&6[DwarfSpawn] &e{countdown}"
  cancelled: "&c[DwarfSpawn] &7Телепортация отменена! Вы двигались."
  success: "&6[DwarfSpawn] &aВы были телепортированы в случайное место!"
  error-spawn: "&c[DwarfSpawn] &7Ошибка: не удалось получить точку спавна из конфига!"
  error-world: "&c[DwarfSpawn] &7Ошибка: мир '&e{world}&7' не найден!"
  error-teleport: "&c[DwarfSpawn] &7Ошибка при телепортации!"
